<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="inner"><circle cx="627" cy="625" r="500"/></clipPath>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#d9482a"/>
      <rect width="3.5" height="9" fill="#faf0df"/>
    </pattern>
    <pattern id="gingham" x="-60" y="85" width="130" height="130" patternUnits="userSpaceOnUse">
      <rect width="130" height="130" fill="#faf0df"/>
      <!-- column stripes (hatched) -->
      <rect x="65" y="0" width="65" height="130" fill="url(#hatch)"/>
      <!-- row stripes (hatched) -->
      <rect x="0" y="65" width="130" height="65" fill="url(#hatch)"/>
      <!-- overlap = solid red -->
      <rect x="65" y="65" width="65" height="65" fill="#d9381a"/>
    </pattern>
  </defs>


  <!-- Outer ring -->
  <circle cx="627" cy="625" r="547" fill="#d02f12"/>
  <circle cx="627" cy="625" r="505" fill="#faf0df"/>

  <!-- Gingham top and bottom -->
  <g clip-path="url(#inner)">
    <rect x="100" y="100" width="1060" height="297" fill="url(#gingham)"/>
    <rect x="100" y="878" width="1060" height="290" fill="url(#gingham)"/>
    <rect x="100" y="397" width="1060" height="481" fill="#faf0df"/>
  </g>
  <circle cx="627" cy="625" r="502" fill="none" stroke="#d02f12" stroke-width="6"/>

  <!-- Pot -->
  <g fill="#cf2e12">
    <!-- lid handle -->
    <path d="M525 480 L525 452 Q525 420 557 420 L693 420 Q725 420 725 452 L725 480 Z"/>
    <!-- lid -->
    <path d="M345 558 C380 505 470 478 540 478 L710 478 C790 480 870 508 908 558 Q912 568 900 568 L352 568 Q340 568 345 558 Z"/>
    <!-- side handles -->
    <path d="M262 572 Q232 572 232 603 Q232 627 262 630 L336 645 L336 586 Z"/>
    <path d="M987 572 Q1022 572 1022 601 Q1022 625 990 629 L917 644 L917 586 Z"/>
    <!-- body -->
    <path d="M335 584 L918 584 L918 765 Q918 853 845 853 L410 853 Q335 853 335 770 Z"/>
  </g>
  <!-- lid handle cutout -->
  <path d="M565 478 L565 455 Q565 446 575 446 L678 446 Q688 446 688 455 L688 478 Z" fill="#faf0df"/>

  <!-- Leaves -->
  <g fill="#faf0df">
    <path d="M627 627 C590 660 584 700 608 735 Q620 752 627 778 Q634 752 646 735 C670 700 664 660 627 627 Z"/>
    <path d="M485 690 C545 686 592 712 606 748 Q614 768 628 780 L612 810 C555 800 492 760 485 690 Z"/>
    <path d="M770 690 C710 686 662 712 648 748 Q640 768 626 780 L642 810 C700 800 762 760 770 690 Z"/>
  </g>
</svg>
